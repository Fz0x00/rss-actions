name: Summarize Articles

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      time-limit:
        description: 'Runtime window in minutes'
        required: false
        default: '45'
      article-limit:
        description: 'Maximum articles to summarize per run (0=unlimited, time-limit controls)'
        required: false
        default: '0'
      platform:
        description: 'LLM platform (gemini/glm/etc.)'
        required: false
        default: ''
      key-type:
        description: 'Only use keys with this key_type (free/coding_plan/paid)'
        required: false
        default: 'free'

concurrency:
  group: rss-data-articles-db
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout data repo
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data

      - name: Checkout followfetch repo
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/rss-followfetch
          token: ${{ secrets.DATA_REPO_PAT }}
          path: followfetch

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: followfetch/go.sum

      - name: Build followfetch
        run: go build -o followfetch-build .
        working-directory: followfetch

      - name: Run summarizer
        id: run
        run: |
          set -o pipefail
          ARGS="--time-limit ${{ github.event.inputs.time-limit || '45' }} --workers-per-key 3"
          if [ -n "${{ github.event.inputs.article-limit }}" ] && [ "${{ github.event.inputs.article-limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.article-limit }}"
          fi
          if [ -n "${{ github.event.inputs.platform }}" ]; then
            ARGS="$ARGS --platform ${{ github.event.inputs.platform }}"
          fi
          if [ -n "${{ github.event.inputs.key-type || 'free' }}" ]; then
            ARGS="$ARGS --key-type ${{ github.event.inputs.key-type || 'free' }}"
          fi
          ../followfetch/followfetch-build summarize \
            --articles-db data/articles.db \
            --key-db data/key.db \
            --token-db data/token.db \
            $ARGS 2>&1 | tee /tmp/summarize.log
          num() { grep -E "^[[:space:]]*$1:" /tmp/summarize.log | tail -1 | grep -oE '[0-9]+' | tail -1 || true; }
          echo "processed=$(num Processed)" >> "$GITHUB_OUTPUT"
          echo "ok=$(num OK)" >> "$GITHUB_OUTPUT"
          echo "errors=$(num Errors)" >> "$GITHUB_OUTPUT"
          echo "remaining=$(num Remaining)" >> "$GITHUB_OUTPUT"
        working-directory: data

      - name: Commit and push updated data
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MONTH=$(date -u +%Y_%m)
          FILES_TO_ADD="data/key.db data/token.db"
          if [ -f "data/articles_${MONTH}.db" ]; then
            FILES_TO_ADD="data/articles_${MONTH}.db $FILES_TO_ADD"
          fi
          git add $FILES_TO_ADD
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: summarize articles with LLM"
            for i in 1 2 3; do
              git push && break
              echo "Push failed, retry $i..."
              sleep 5
            done
          fi

      # 闸门放在 push 之后：本轮即使零成功，key.db 里的 last_error / 解活状态也要先落库，
      # 再让作业变红——否则下一轮无从判断是同一把 key 在持续失败。
      - name: Assert summarizer progress
        run: |
          PROCESSED="${{ steps.run.outputs.processed }}"
          OK="${{ steps.run.outputs.ok }}"
          ERRORS="${{ steps.run.outputs.errors }}"
          REMAINING="${{ steps.run.outputs.remaining }}"
          echo "### Summarize 本轮产出" >> "$GITHUB_STEP_SUMMARY"
          echo "Processed=$PROCESSED · OK=$OK · Errors=$ERRORS · Remaining=$REMAINING" >> "$GITHUB_STEP_SUMMARY"
          if [ "${PROCESSED:-0}" -gt 0 ] && [ "${OK:-0}" -eq 0 ]; then
            echo "::error::本轮摘要零成功（Processed=$PROCESSED / Errors=$ERRORS）：key 池或模型疑已失效，查 rss-data 的 key.db.api_keys.last_error"
            exit 1
          fi
