name: Fetch + Summarize

# 单 job 串行跑 fetch → summarize：只 checkout 一次、顺序天然正确，
# 不再出现 fetch 排到下一小时甚至被 summarize 挤掉的情况。
on:
  schedule:
    # 2026-11-04 调整：GitHub schedule 在本账号严重降级 —— 实测 `7 * * * *`
    # 近 23h 只派发 2 次（≈9%），且频率越高交付率越差（探针 `*/5` 40 分钟 0 次）。
    # 因此降频到 3 小时一轮（8 轮/天）换取更高命中率，同时把每轮窗口从 30min
    # 拉到 55min 补产能。UTC '45 2,5,8,11,14,17,20,23' =
    # 北京 10:45/13:45/16:45/19:45/22:45/次日 01:45/04:45/07:45，
    # 即每天第一个周期落在北京凌晨 01:45。
    # 不用整点（:00）是为了避开 GitHub 调度器整点拥堵。
    - cron: '45 2,5,8,11,14,17,20,23 * * *'
  workflow_run:
    workflows: ["Deploy Dashboard"]
    types: [completed]
  workflow_dispatch:
    inputs:
      time-limit:
        description: 'Summarize 运行窗口（分钟）'
        required: false
        default: '55'
      article-limit:
        description: '本轮最多摘要篇数（0=由 time-limit 控制）'
        required: false
        default: '0'
      fetch-limit:
        description: '每个账号拉取条数'
        required: false
        default: '50'
      workers-per-key:
        description: '每个 key 的并发 worker 数'
        required: false
        default: '3'
      key-type:
        description: '可用 key 类型，逗号分隔（降级链）'
        required: false
        default: 'free,coding_plan'
      platform:
        description: '强制平台（留空=自动）'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: rss-data-articles-db
  cancel-in-progress: false

jobs:
  # 防反馈环：rss-data push → export.yml → Deploy Dashboard → workflow_run →
  # 本 workflow → fetch 更新 last_article_at → 又 push……正常时 summarize 跑满
  # 55 分钟，环自然拉长；但 key 全冷却时 summarize 秒退，环会加速到
  # ~45 秒/轮（2026-11-04 03:25–03:55 UTC 出现过 30 分钟 41 轮的风暴，全部空转）。
  # 因此 workflow_run 触发时检查上一轮完成时间：20 分钟内直接 skip。
  # schedule / workflow_dispatch 不节流（手动入口和 3 小时 cron 保持原语义）。
  throttle:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check last pipeline completion
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }}：不节流"
            exit 0
          fi
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pipeline.yml/runs?per_page=15" \
            --jq '[.workflow_runs[] | select(.status=="completed") | .updated_at] | max // empty' 2>/dev/null || true)
          if [ -z "$LAST" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "查不到已完成的 run，照常执行"
            exit 0
          fi
          AGE=$(( $(date -u +%s) - $(date -u -d "$LAST" +%s) ))
          if [ "$AGE" -lt 1200 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "节流：上一轮完成于 ${AGE}s 前（<1200s），skip 以打断 deploy→pipeline 反馈环"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "上一轮完成于 ${AGE}s 前（>=1200s），照常执行"
          fi

  pipeline:
    needs: [throttle]
    if: needs.throttle.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # 必须 > time-limit（55）+ fetch/build/commit 开销（实测约 1 分钟），
    # 否则被 kill 时 Commit and push 不执行，整轮已付费的摘要全部丢弃。
    timeout-minutes: 90
    outputs:
      zero-alert: ${{ steps.fetch.outputs.zero_alert }}
      processed: ${{ steps.summarize.outputs.processed }}
      ok: ${{ steps.summarize.outputs.ok }}
      errors: ${{ steps.summarize.outputs.errors }}
    steps:
      - name: Checkout data repo
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data

      - name: Checkout followfetch repo
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/rss-followfetch
          token: ${{ secrets.DATA_REPO_PAT }}
          path: followfetch

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: followfetch/go.sum

      - name: Build followfetch
        run: go build -o followfetch-build .
        working-directory: followfetch

      - name: Run fetch
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          ./followfetch/followfetch-build fetch \
            --accounts data/data/accounts.db \
            --articles-db data/data/articles.db \
            --db data/data/rss.db \
            --mode auto --limit ${{ github.event.inputs.fetch-limit || '50' }} 2>&1 | tee /tmp/fetch.log
          NEW=$(grep -E '^New articles:' /tmp/fetch.log | tail -1 | grep -oE '[0-9]+' | tail -1 || true)
          NEW=${NEW:-0}
          EVENT="${{ github.event_name }}"
          STREAK=0
          if [ -f data/.fetch_zero_streak ]; then
            STREAK=$(cat data/.fetch_zero_streak 2>/dev/null || echo 0)
          fi
          case "$STREAK" in ''|*[!0-9]*) STREAK=0 ;; esac
          if [ "$NEW" -ne 0 ]; then
            # 有新增 = 上游健康，任何触发方式都清零。
            STREAK=0
          elif [ "$EVENT" = "workflow_run" ]; then
            # 反馈环触发的短间隔重跑几乎必然 0 新增（上一轮几十秒前刚抓完），
            # 不计入 streak——2026-11-04 03:25–03:27 UTC 三轮 90 秒内连击就误报过
            # 一次「Folo 账号或上游异常」。环路轮次只读不加，计数交给 schedule 轮次。
            echo "workflow_run 触发且 0 新增：streak=$STREAK 保持不变"
          else
            STREAK=$((STREAK + 1))
          fi
          echo "$STREAK" > data/.fetch_zero_streak
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "zero_streak=$STREAK" >> "$GITHUB_OUTPUT"
          # 告警也只在 schedule / workflow_dispatch 上发：环路轮次不重复报警。
          # 注意 cron 已从每小时降到 3 小时一轮（8 轮/天），所以 streak>=3 意味着
          # 约 9 小时全无新增才告警——比原来的 3 小时更保守，误报更少。
          if [ "$STREAK" -ge 3 ] && [ "$EVENT" != "workflow_run" ]; then
            echo "zero_alert=1" >> "$GITHUB_OUTPUT"
          else
            echo "zero_alert=0" >> "$GITHUB_OUTPUT"
          fi
          echo "Fetch new=$NEW, zero streak=$STREAK (event=$EVENT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run summarize
        id: summarize
        continue-on-error: true
        run: |
          set -o pipefail
          ARGS="--time-limit ${{ github.event.inputs.time-limit || '55' }} --workers-per-key ${{ github.event.inputs.workers-per-key || '3' }}"
          if [ -n "${{ github.event.inputs.article-limit }}" ] && [ "${{ github.event.inputs.article-limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.article-limit }}"
          fi
          if [ -n "${{ github.event.inputs.platform }}" ]; then
            ARGS="$ARGS --platform ${{ github.event.inputs.platform }}"
          fi
          if [ -n "${{ github.event.inputs.key-type || 'free,coding_plan' }}" ]; then
            ARGS="$ARGS --key-type ${{ github.event.inputs.key-type || 'free,coding_plan' }}"
          fi
          ../followfetch/followfetch-build summarize \
            --articles-db data/articles.db \
            --key-db data/key.db \
            --token-db data/token.db \
            $ARGS 2>&1 | tee /tmp/summarize.log
          num() { grep -E "^[[:space:]]*$1:" /tmp/summarize.log | tail -1 | grep -oE '[0-9]+' | tail -1 || true; }
          PROCESSED=$(num Processed); PROCESSED=${PROCESSED:-0}
          OK=$(num OK); OK=${OK:-0}
          ERRORS=$(num Errors); ERRORS=${ERRORS:-0}
          REMAINING=$(num Remaining); REMAINING=${REMAINING:-0}
          echo "processed=$PROCESSED" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"
          echo "Summarize processed=$PROCESSED ok=$OK errors=$ERRORS remaining=$REMAINING" >> "$GITHUB_STEP_SUMMARY"
        working-directory: data

      - name: Reconcile cross-month duplicates (daily, 北京凌晨窗口)
        id: reconcile
        if: github.event_name == 'schedule' && github.event.schedule == '45 2,5,8,11,14,17,20,23 * * *'
        run: |
          # cron 从 24 轮/天降到 8 轮后，原本挂在 03:00 UTC 的跨月去重没有槽位了，
          # 改挂到北京凌晨的三个连续周期（UTC 17/20/23 = 北京 01:45/04:45/07:45）。
          # 该步骤只做 SQLite 内部去重、不调 API、且幂等，多跑几次无副作用；
          # 之所以不只认 17 点，是因为 GitHub schedule 实测会漂移 5–9 小时，
          # 只认单点很可能整晚都错过。
          case "$(date -u +%H)" in
            17|20|23) ;;
            *) echo "skip reconcile (hour=$(date -u +%H) UTC)"; exit 0 ;;
          esac
          ../followfetch/followfetch-build summarize \
            --articles-db data/articles.db \
            --key-db data/key.db \
            --token-db data/token.db \
            --reconcile-duplicates-only
        working-directory: data

      - name: Commit and push updated data
        if: always()
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # fetch 写当月库；summarize 还会写前两个月库。全部纳入提交范围，
          # 未改动的文件不会被 staged。
          FILES_TO_ADD="data/key.db data/token.db .fetch_zero_streak"
          for f in data/articles_*.db; do
            [ -f "$f" ] && FILES_TO_ADD="$FILES_TO_ADD $f"
          done
          for f in data/articles_*.db.perfeed-needed; do
            [ -f "$f" ] && FILES_TO_ADD="$FILES_TO_ADD $f"
          done
          git add $FILES_TO_ADD
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: fetch + summarize"
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase origin main; then
                if git push; then PUSHED=1; break; fi
              else
                # 摘要是本轮已付费的产物，冲突时保我方；缺的文章行下轮补。
                git rebase --abort 2>/dev/null || true
                git pull origin main --no-rebase || true
                for f in data/articles_*.db data/key.db data/token.db; do
                  git checkout --ours "$f" 2>/dev/null || true
                done
                git add $FILES_TO_ADD
                if [ -e "$(git rev-parse --git-path MERGE_HEAD)" ]; then
                  git commit --no-edit -m "auto: fetch + summarize (merge retry $i)"
                else
                  git diff --cached --quiet || git commit -m "auto: fetch + summarize (retry $i)"
                fi
                if git push; then PUSHED=1; break; fi
              fi
              sleep 5
            done
            if [ "$PUSHED" != "1" ]; then
              echo "::error::3 次 push 均未成功，本轮产物未落库"
              exit 1
            fi
          fi

      - name: Assert pipeline progress
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          SUMMARIZE_OUTCOME: ${{ steps.summarize.outcome }}
          PROCESSED: ${{ steps.summarize.outputs.processed }}
          OK: ${{ steps.summarize.outputs.ok }}
        run: |
          FAIL=0
          if [ "$FETCH_OUTCOME" != "success" ]; then
            echo "::warning::fetch 本轮失败（outcome=$FETCH_OUTCOME）"
          fi
          if [ "$SUMMARIZE_OUTCOME" != "success" ]; then
            echo "::error::summarize 本轮失败（outcome=$SUMMARIZE_OUTCOME）"
            FAIL=1
          fi
          if [ "${PROCESSED:-0}" -gt 0 ] && [ "${OK:-0}" -eq 0 ]; then
            echo "::error::本轮摘要零成功（Processed=$PROCESSED / OK=$OK）：查 key.db 的 last_error"
            FAIL=1
          fi
          exit $FAIL

  notify-zero:
    needs: [pipeline]
    if: needs.pipeline.result == 'success' && needs.pipeline.outputs.zero-alert == '1'
    uses: ./.github/workflows/notify-feishu.yml
    with:
      result: warning
      detail: 'fetch 连续 3 轮 New articles=0，疑似 Folo 账号或上游异常'
    secrets: inherit

  notify:
    needs: [pipeline]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-feishu.yml
    with:
      result: ${{ needs.pipeline.result }}
    secrets: inherit
