name: Sync D1 to rss.db

# 消费 dashboard 仓提交的 data/d1-export.json，把 feeds 表写回 rss.db。
# 放在 rss-data-rss-db 并发组内，与 check / enrich / score-recompute 串行；
# 不需要 Cloudflare D1 凭据（导出在 dashboard 仓完成）。
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-d1]

permissions:
  contents: read

concurrency:
  group: rss-data-rss-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rss-dashboard (sync script)
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/rss-dashboard
          token: ${{ secrets.DATA_REPO_PAT }}
          path: dashboard

      - name: Checkout rss-data
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/rss-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data

      - name: Check export file
        id: check
        run: |
          if [ ! -s data/data/d1-export.json ]; then
            echo "d1-export.json 不存在或为空，跳过本轮"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.check.outputs.skip == '0'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: dashboard/go.sum

      - name: Run sync script
        if: steps.check.outputs.skip == '0'
        working-directory: dashboard
        run: |
          go run ./scripts/sync-d1-to-rssdb/ \
            -d1-export ../data/data/d1-export.json \
            -rss-db ../data/data/rss.db

      - name: Commit and push rss-data
        if: steps.check.outputs.skip == '0'
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rss.db
          if git diff --cached --quiet; then
            echo "无变更，跳过推送"
          else
            git commit -m "sync: D1 → rss.db feeds table ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase origin main; then
                if git push; then PUSHED=1; break; fi
              else
                git rebase --abort 2>/dev/null || true
                git pull origin main --no-rebase || true
                git checkout --theirs data/rss.db 2>/dev/null || true
                git add data/rss.db
                git diff --cached --quiet || git commit -m "sync: D1 → rss.db (retry $i)"
                if git push; then PUSHED=1; break; fi
              fi
              sleep 5
            done
            if [ "$PUSHED" != "1" ]; then
              echo "::error::3 次 push 均未成功，D1 导出未落库"
              exit 1
            fi
          fi

      - name: Trigger dashboard deploy
        if: success() && steps.check.outputs.skip == '0'
        run: |
          gh api repos/${{ github.repository_owner }}/rss-actions/dispatches \
            -f event_type=data-updated
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}

  notify:
    needs: [sync]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-feishu.yml
    with:
      result: ${{ needs.sync.result }}
    secrets: inherit
