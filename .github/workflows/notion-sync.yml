name: Notion Sync

# rssFollow 高价值文章 → FLO.W 信息港口（Notion）
# 数据源：rss-data 私有仓（checkout 到 app/packages/rss-data）
# 写入：Notion REST API（NOTION_TOKEN secret）
# 状态：rss-data/data/flow-clip-state.json（入库，跨运行累积 synced 统计）
# 调度：每日 01:30 UTC = 09:30 北京时间

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '只预览不写入'
        type: boolean
        default: false
      limit:
        description: '只写前 N 篇（0=不限制）'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout rssFollow (scripts)
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/rssFollow
          token: ${{ secrets.DATA_REPO_PAT }}
          sparse-checkout: |
            scripts/flow-clip-sync.py
          sparse-checkout-cone-mode: false
          path: app

      - name: Checkout rss-data
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/rss-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: app/packages/rss-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FLOW_CLIP_DATA_DIR: ${{ github.workspace }}/app/packages/rss-data/data
          FLOW_CLIP_STATE_FILE: ${{ github.workspace }}/app/packages/rss-data/data/flow-clip-state.json
          FLOW_CLIP_KICK_LOG: ${{ github.workspace }}/app/packages/rss-data/data/flow-clip-kick-log.json
        run: |
          cd app
          if [ "${{ inputs.dry }}" = "true" ]; then
            python3 scripts/flow-clip-sync.py --dry
          else
            python3 scripts/flow-clip-sync.py --limit "${{ inputs.limit || '0' }}"
          fi

      - name: Commit state back
        if: ${{ inputs.dry != true }}
        working-directory: app/packages/rss-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/flow-clip-state.json; then
            echo "state unchanged"
            exit 0
          fi
          git add data/flow-clip-state.json
          git commit -m "auto: flow-clip sync state ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  notify:
    needs: [sync]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-feishu.yml
    with:
      result: ${{ needs.sync.result }}
    secrets: inherit
