name: Aggregate Stats

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时
  workflow_dispatch:
    inputs:
      days:
        description: '统计最近多少天'
        required: false
        default: '30'
      since:
        description: '导出此日期之后的文章 (格式: 2006-01-02，留空则导出今日)'
        required: false
        default: ''

concurrency:
  group: rss-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rss-data
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/rss-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data

      - name: Download rss-stats
        run: |
          gh release download --repo ${{ github.repository_owner }}/rss-stats \
            --pattern 'rss-stats-linux-amd64' --output rss-stats --clobber
          chmod +x rss-stats
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}

      - name: Run aggregate
        run: |
          DAYS=${{ github.event.inputs.days || '30' }}
          # 跨月合并最近 3 个月的 articles DB，避免月初 30 天统计被截断
          DBS=""
          for OFFSET in 0 1 2; do
            if [ "$OFFSET" = "0" ]; then
              M=$(date -u +%Y_%m)
            else
              M=$(date -u -d "$OFFSET month ago" +%Y_%m 2>/dev/null || date -u -v-${OFFSET}m +%Y_%m)
            fi
            [ -f "data/data/articles_${M}.db" ] && DBS="$DBS --articles-db data/data/articles_${M}.db"
          done
          [ -z "$DBS" ] && DBS="--articles-db data/data/articles.db"

          ./rss-stats aggregate --days $DAYS --output data/data/daily_stats.json $DBS

      - name: Export new articles
        run: |
          DBS=""
          for OFFSET in 0 1 2; do
            if [ "$OFFSET" = "0" ]; then
              M=$(date -u +%Y_%m)
            else
              M=$(date -u -d "$OFFSET month ago" +%Y_%m 2>/dev/null || date -u -v-${OFFSET}m +%Y_%m)
            fi
            [ -f "data/data/articles_${M}.db" ] && DBS="$DBS --articles-db data/data/articles_${M}.db"
          done
          [ -z "$DBS" ] && DBS="--articles-db data/data/articles.db"

          SINCE="${{ github.event.inputs.since }}"
          ARGS="$DBS --output data/data/new_articles.json"
          
          if [ -n "$SINCE" ]; then
            ARGS="$ARGS --since $SINCE"
          fi
          
          ./rss-stats export $ARGS

      - name: Install wrangler
        run: npm install wrangler@4

      - name: Upload to R2
        run: |
          npx wrangler r2 object put rss-dashboard-data/daily_stats.json \
            --file data/data/daily_stats.json --remote
          npx wrangler r2 object put rss-dashboard-data/new_articles.json \
            --file data/data/new_articles.json --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Commit and push
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_stats.json data/new_articles.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "stats: update daily_stats.json and new_articles.json ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase origin main; then
                if git push; then PUSHED=1; break; fi
              else
                # 这两个 JSON 每 6 小时整体重算，冲突时以远端为基底、下轮覆盖即可
                git rebase --abort 2>/dev/null || true
                git pull origin main --no-rebase || true
                git checkout --theirs data/daily_stats.json 2>/dev/null || true
                git checkout --theirs data/new_articles.json 2>/dev/null || true
                git add data/daily_stats.json data/new_articles.json
                # 同上：取 --theirs 后索引可能等于 HEAD，必须显式收尾合并，否则 git push 会因
                # MERGE_HEAD 存在而拒绝执行。
                if [ -e "$(git rev-parse --git-path MERGE_HEAD)" ]; then
                  git commit --no-edit -m "stats: update daily_stats.json and new_articles.json (merge retry $i)"
                else
                  git diff --cached --quiet || git commit -m "stats: update daily_stats.json and new_articles.json (retry $i)"
                fi
                if git push; then PUSHED=1; break; fi
              fi
              sleep 5
            done
            if [ "$PUSHED" != "1" ]; then
              echo "::error::3 次 push 均未成功，本轮统计未落库（R2 已更新，git 侧未更新）"
              exit 1
            fi
          fi

  notify:
    needs: [stats]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-feishu.yml
    with:
      result: ${{ needs.stats.result }}
    secrets: inherit
